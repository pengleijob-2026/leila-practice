<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>《GitHub》—— 一个关于协作的地方</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body.play { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  body.play canvas { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #e9e2cf; font: 28px "Noto Serif CJK SC", serif; letter-spacing: 4px; cursor: pointer;
    background: rgba(0,0,0,.55); }
  body.render #start { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="start">▶ 点击播放</div>
<audio id="music" src="soundtrack.m4a" preload="auto"></audio>
<script>
const W = 1920, H = 1080, DURATION = 194;
const SERIF = '"Noto Serif CJK SC", "Noto Serif", serif';
const SERIF_EN = '"Noto Serif", "Noto Serif CJK SC", serif';
const MONO = '"DejaVu Sans Mono", "Noto Sans CJK SC", monospace';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20080410);
const RN = []; for (let i = 0; i < 20000; i++) RN.push(rnd());
const R = i => RN[((Math.floor(i) % 20000) + 20000) % 20000];
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const eio = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eo = u => 1 - Math.pow(1 - u, 3);
const win = (t, a, b, f = 0.6) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));

const COL = {
  blue: [110, 135, 255], gold: [255, 190, 110], white: [255, 250, 240], cyan: [150, 215, 255],
  purple: [165, 120, 255], red: [255, 95, 80], green: [130, 240, 170],
};
const rgba = (c, a) => `rgba(${COL[c].join(',')},${a})`;
const SPR = {};
for (const k in COL) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); const [r, gg, b] = COL[k];
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.12, `rgba(${r},${gg},${b},0.9)`);
  gr.addColorStop(0.4, `rgba(${r},${gg},${b},0.22)`);
  gr.addColorStop(1, `rgba(${r},${gg},${b},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); SPR[k] = c;
}

function dot(x, y, r, col, a) {
  if (a <= 0.003) return;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = Math.min(1, a);
  ctx.drawImage(SPR[col], x - r, y - r, 2 * r, 2 * r);
}
function orb(x, y, r, col, a) { dot(x, y, r * 7, col, a * 0.45); dot(x, y, r * 2.6, col, a); dot(x, y, r * 1.1, 'white', a); }
function ring(x, y, r, col, a, lw = 1.5) {
  if (a <= 0) return;
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = clamp(a);
  ctx.strokeStyle = rgba(col, 1); ctx.lineWidth = lw;
  ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 6.2832); ctx.stroke();
}
function cnode(x, y, col, at, lt, A, r = 7) {
  const ap = seg(lt, at, at + 0.35); if (ap <= 0) return;
  const fl = 1 - seg(lt, at, at + 1.2);
  dot(x, y, 30 + fl * 90, col, A * fl * 0.5);
  if (fl > 0) ring(x, y, 12 + (1 - fl) * 55, col, A * fl * 0.6);
  orb(x, y, r, col, A * ap);
}

const bez = (p0, p1, p2, p3) => u => { const v = 1 - u; return [v * v * v * p0[0] + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * p3[0], v * v * v * p0[1] + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * p3[1]]; };
const line = (a, b) => u => [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];

// A "dust" stroke: a faint core line plus scattered glowing grains, like the particle threads in the reference.
function dust(fn, from, to, col, t, o = {}) {
  const n = o.n || 260, w = o.w ?? 5, seed = o.seed || 0, a = o.a ?? 1, size = o.size || 1;
  if (to <= from || a <= 0) return;
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1;
  ctx.strokeStyle = rgba(col, 0.32 * a); ctx.lineWidth = o.lw || 1.3;
  ctx.beginPath();
  const steps = 48;
  for (let k = 0; k <= steps; k++) { const p = fn(lerp(from, to, k / steps)); k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
  ctx.stroke();
  for (let i = 0; i < n; i++) {
    const u = i / n; if (u < from || u > to) continue;
    const p = fn(u), q = fn(Math.min(1, u + 0.003));
    const dx = q[0] - p[0], dy = q[1] - p[1]; const L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L;
    const j = (R(seed + i * 3) - 0.5) * 2;
    const off = j * Math.abs(j) * w + Math.sin(t * 1.5 + i) * 0.8;
    const tw = 0.55 + 0.45 * Math.sin(t * 3 + i * 1.7);
    dot(p[0] + nx * off, p[1] + ny * off, (2 + R(seed + i * 3 + 1) * 4) * size, col, a * tw * (0.35 + 0.65 * R(seed + i * 3 + 2)));
  }
  if (o.head && to < 1) { const p = fn(to); dot(p[0], p[1], 22, col, a * 0.9); }
}
function flow(fn, col, t, a, n = 12, speed = 0.35, seed = 0, r = 10) {
  if (a <= 0) return;
  for (let k = 0; k < n; k++) { const u = (t * speed + k / n + R(seed + k) * 0.05) % 1; const p = fn(u); dot(p[0], p[1], r, col, a * Math.sin(u * Math.PI)); }
}

function txt(s, x, y, o = {}) {
  const { size = 24, col = '#e9e4d8', a = 1, align = 'center', font = SERIF, weight = '', italic = false, base = 'middle', shadow = 0 } = o;
  if (a <= 0.003) return;
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = clamp(a);
  ctx.fillStyle = col; ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = base;
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = shadow; }
  ctx.fillText(s, x, y);
  ctx.shadowBlur = 0;
}
function panel(x, y, w, h, a, o = {}) {
  if (a <= 0) return;
  const { border = 'rgba(170,185,255,0.45)', fill = 'rgba(10,12,28,0.82)', r = 10, lw = 1.3 } = o;
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = clamp(a);
  ctx.fillStyle = fill; ctx.strokeStyle = border; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); ctx.stroke();
}
function strokeLine(x1, y1, x2, y2, a, col = 'rgba(216,208,189,1)', lw = 1) {
  if (a <= 0) return;
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = clamp(a);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

/* ---------------- background ---------------- */
const STARS = [];
for (let i = 0; i < 1100; i++) {
  const c = R(i * 7 + 3);
  STARS.push({ x: R(i * 7) * W, y: R(i * 7 + 1) * H, z: 0.2 + R(i * 7 + 2) * 0.8, c: c < 0.55 ? 'blue' : (c < 0.8 ? 'purple' : 'gold'), p: R(i * 7 + 4) * 6.28, s: 0.5 + R(i * 7 + 5) * 2 });
}
function background(t) {
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const g = ctx.createRadialGradient(W / 2, H * 0.45, 100, W / 2, H / 2, W * 0.7);
  g.addColorStop(0, '#0b0d1c'); g.addColorStop(1, '#020207');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of STARS) {
    const x = ((s.x - t * 6 * s.z) % W + W) % W;
    const y = s.y + Math.sin(t * 0.1 + s.p) * 6 * s.z;
    const tw = 0.5 + 0.5 * Math.sin(t * s.s + s.p);
    dot(x, y, 1.5 + s.z * 3.5, s.c, (0.1 + 0.38 * tw) * s.z);
  }
}
function vignette() {
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

/* ---------------- subtitles & labels ---------------- */
function subtitle(zh, en, lt, dur) {
  const out = 1 - seg(lt, dur - 0.5, dur);
  if (out <= 0 || lt < 0) return;
  const chars = []; let hl = false;
  for (const ch of zh) { if (ch === '【') { hl = true; continue; } if (ch === '】') { hl = false; continue; } chars.push({ ch, hl }); }
  ctx.font = `40px ${SERIF}`;
  const sp = 3; let total = 0;
  const ws = chars.map(c => { const w = ctx.measureText(c.ch).width; total += w + sp; return w; });
  total -= sp;
  let x = W / 2 - total / 2; const y = 885;
  chars.forEach((c, i) => {
    const a = eo(seg(lt, 0.1 + i * 0.035, 0.1 + i * 0.035 + 0.5)) * out;
    txt(c.ch, x + ws[i] / 2, y + (1 - a) * 6, { size: 40, col: c.hl ? '#f2b56b' : '#ece6da', a, weight: c.hl ? '600' : '', shadow: 10 });
    x += ws[i] + sp;
  });
  const da = seg(lt, 0.3, 1) * out;
  strokeLine(W / 2 - 46, y + 40, W / 2 + 46, y + 40, da * 0.45);
  dot(W / 2, y + 40, 8, 'gold', da * 0.7);
  txt(en, W / 2, y + 72, { size: 22, col: '#bab6c6', a: seg(lt, 0.6, 1.4) * out * 0.85, italic: true, font: SERIF_EN, shadow: 8 });
}
function label(year, cap, a) {
  if (!year || a <= 0) return;
  strokeLine(36, 80, 78, 80, a * 0.7);
  txt(year, 94, 80, { size: 28, weight: '700', align: 'left', a, col: '#ece4d0' });
  txt(cap, 94, 116, { size: 17, align: 'left', a: a * 0.72, col: '#b8b2a4' });
}

/* ---------------- particle text ---------------- */
function makeTextPts(str, size, cx, cy, step) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.font = `600 ${size}px ${SERIF_EN}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(str, cx, cy);
  const d = g.getImageData(0, 0, W, H).data; const pts = [];
  for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) {
    if (d[(y * W + x) * 4 + 3] > 128) pts.push([x + (R(x * 7 + y) - 0.5) * step, y + (R(x + y * 13) - 0.5) * step]);
  }
  return pts;
}
const TP = {};
function particleTitle(pts, lt, A, t, t0, t1, seedBase) {
  for (let i = 0; i < pts.length; i++) {
    const d = R(seedBase + i * 5);
    const arr = eio(seg(lt, t0 + d * (t1 - t0) * 0.6, t0 + (t1 - t0) * 0.5 + d * (t1 - t0) * 0.5));
    const sx = R(seedBase + i * 5 + 1) * W, sy = R(seedBase + i * 5 + 2) * H;
    const ang = t * 0.25 + R(seedBase + i * 5 + 3) * 6.28, sw = (1 - arr) * 50;
    const x = lerp(sx, pts[i][0], arr) + Math.cos(ang) * sw, y = lerp(sy, pts[i][1], arr) + Math.sin(ang) * sw;
    const tw = 0.6 + 0.4 * Math.sin(t * 2.5 + i);
    const col = arr > 0.9 ? (R(i * 3) < 0.7 ? 'gold' : 'white') : (R(i * 3) < 0.6 ? 'blue' : 'purple');
    dot(x, y, arr > 0.98 ? 3.4 : 2.5 + R(i) * 2, col, A * tw * (0.3 + 0.55 * arr));
  }
}

/* ---------------- scene 1: opening ---------------- */
function s1(lt, A, t) {
  particleTitle(TP.title, lt, A, t, 2.4, 7.2, 100);
  const f = seg(lt, 6, 8);
  dot(960, 450, 520, 'gold', A * f * 0.1);
  txt('代码 · 协作 · 开源', 960, 640, { size: 28, col: '#d9d1bf', a: A * seg(lt, 7.5, 9) });
  txt('CODE  ·  COLLABORATION  ·  OPEN SOURCE', 960, 686, { size: 16, col: '#9d98a8', a: A * seg(lt, 8, 9.5), font: SERIF_EN });
}

/* ---------------- scene 2: life before version control ---------------- */
const FILES = ['report.doc', 'report_final.doc', 'report_final2.doc', 'report_最终版.doc', 'report_真的最终版.doc'];
function fileCard(x, y, name, a, o = {}) {
  if (a <= 0) return;
  const { w = 200, h = 240, red = 0 } = o;
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = clamp(a);
  const x0 = x - w / 2, y0 = y - h / 2, f = 34;
  ctx.fillStyle = 'rgba(14,16,34,0.88)';
  ctx.strokeStyle = red > 0 ? `rgba(255,${Math.round(150 - red * 60)},${Math.round(130 - red * 60)},${0.6 + red * 0.4})` : 'rgba(170,185,255,0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + w - f, y0); ctx.lineTo(x0 + w, y0 + f); ctx.lineTo(x0 + w, y0 + h); ctx.lineTo(x0, y0 + h); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x0 + w - f, y0); ctx.lineTo(x0 + w - f, y0 + f); ctx.lineTo(x0 + w, y0 + f); ctx.stroke();
  ctx.fillStyle = 'rgba(170,185,255,0.25)';
  for (let k = 0; k < 6; k++) ctx.fillRect(x0 + 22, y0 + 58 + k * 22, (w - 44) * (k % 3 === 2 ? 0.6 : 1), 3);
  txt(name, x, y0 + h - 28, { size: 14, font: MONO, col: '#e6e2f0', a });
  dot(x, y, w * 1.1, red > 0 ? 'red' : 'blue', a * 0.1 * (1 + red));
}
function s2(lt, A, t) {
  const B = seg(lt, 6.2, 7.5), C = seg(lt, 11.6, 12.6);
  if (C < 1) {
    for (let i = 0; i < 5; i++) {
      const appear = i === 0 ? seg(lt, 1, 2) : eo(seg(lt, 6.5 + i * 0.9, 7.1 + i * 0.9));
      const sx = 960 + (i - 2) * 235;
      const x = i === 0 ? lerp(960, sx, eio(B)) : sx;
      const y = 420 + (i === 0 ? 0 : (1 - appear) * 30);
      fileCard(x, y, FILES[i], A * appear * (1 - C));
    }
  }
  if (C > 0) {
    const cx = 960, cy = 420, conf = seg(lt, 14, 15);
    for (let k = 0; k < 10; k++) {
      const ang = k / 10 * 6.283 - 1.57 + 0.31;
      const px = cx + Math.cos(ang) * 560, py = cy + Math.sin(ang) * 300;
      const ap = eo(seg(lt, 12 + k * 0.15, 13 + k * 0.15));
      orb(px, py, 6, 'blue', A * ap);
      const fn = line([px, py], [cx, cy]);
      dust(fn, 0, eo(seg(lt, 12.5 + k * 0.15, 14 + k * 0.15)) * 0.8, 'blue', t, { n: 90, w: 4, seed: k * 500, a: A * 0.7 });
      flow(u => fn(u * 0.8), 'cyan', t, A * 0.8 * conf, 4, 0.6, k * 30);
    }
    const fl = conf * (0.5 + 0.5 * Math.sin(t * 14));
    fileCard(cx, cy, 'main.js', A * C, { red: fl });
    for (let s = 0; s < 30; s++) {
      const ph = (t * 1.3 + R(s * 9)) % 1, ang = R(s * 9 + 1) * 6.28, rr = 60 + ph * 170;
      dot(cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr * 0.8, 5, 'red', A * conf * (1 - ph) * 0.9);
    }
    txt('冲突  CONFLICT', cx, cy - 165, { size: 22, col: '#ff8a70', a: A * conf * (0.6 + 0.4 * Math.sin(t * 10)), weight: '600' });
  }
}

/* ---------------- scene 3: Git & commits ---------------- */
const HASH = ['a1f3c9', '7e2d41', '3b9c0e', 'f0a8d2', 'c45e17', '9d2b6a', 'e81f03'];
const MSG = ['初始化项目', '登录页面', '修复 bug', '添加搜索', '调整样式', '性能优化', '发布 v1.0'];
function s3(lt, A, t) {
  const y = 520, X = i => 270 + i * 230;
  dust(line([150, y], [1770, y]), 0, eo(seg(lt, 0.3, 3)), 'blue', t, { n: 420, w: 4, seed: 1, a: A * 0.8 });
  const back = eio(seg(lt, 17.8, 20.2));
  const headIdx = lt < 17.6 ? 6 : lerp(6, 2, back);
  for (let i = 0; i < 7; i++) {
    const at = 1.2 + i * 1.4;
    const ap = seg(lt, at, at + 0.4); if (ap <= 0) continue;
    const dim = i > headIdx + 0.01 ? 0.25 : 1;
    cnode(X(i), y, 'gold', at, lt, A * dim);
    txt(MSG[i], X(i), y - 50, { size: 21, a: A * ap * dim });
    txt(HASH[i], X(i), y + 44, { size: 15, font: MONO, col: '#9a96aa', a: A * ap * dim });
  }
  const ca = A * win(lt, 12.6, 17.4, 0.5);
  if (ca > 0) {
    const cx = X(3), w = 400, h = 168, x0 = cx - w / 2, y0 = 172;
    strokeLine(cx, y0 + h, cx, y - 78, ca * 0.6, 'rgba(255,190,110,1)');
    panel(x0, y0, w, h, ca, { border: 'rgba(255,190,110,0.6)' });
    txt('commit f0a8d2', x0 + 24, y0 + 32, { size: 19, font: MONO, col: '#f2b56b', a: ca, align: 'left' });
    txt('作者    小明', x0 + 24, y0 + 70, { size: 19, a: ca, align: 'left', col: '#ddd8ea' });
    txt('时间    周二 14:32', x0 + 24, y0 + 102, { size: 19, a: ca, align: 'left', col: '#ddd8ea' });
    txt('修改    search.js', x0 + 24, y0 + 134, { size: 19, a: ca, align: 'left', col: '#ddd8ea' });
    txt('+42', x0 + 270, y0 + 134, { size: 19, font: MONO, a: ca, align: 'left', col: '#8fe8b0' });
    txt('−7', x0 + 330, y0 + 134, { size: 19, font: MONO, a: ca, align: 'left', col: '#ff8a78' });
  }
  const ha = A * seg(lt, 17.6, 18.2);
  if (ha > 0) {
    const hx = lerp(X(6), X(2), back);
    ring(hx, y, 20, 'white', ha, 2);
    dot(hx, y, 44, 'white', ha * 0.35);
    txt('HEAD', hx, y + 84, { size: 17, font: MONO, col: '#ffffff', a: ha, weight: '700' });
    strokeLine(hx, y + 24, hx, y + 68, ha * 0.5, 'rgba(255,255,255,1)');
    const rw = win(lt, 17.8, 20.4, 0.3);
    for (let k = 0; k < 16; k++) {
      const u = (t * 0.9 + k / 16) % 1, sx = lerp(X(6) + 40, hx, u);
      dot(sx, y + (R(k + 40) - 0.5) * 16, 7, 'cyan', A * rw * Math.sin(u * Math.PI));
    }
  }
}

/* ---------------- scene 4: branch & merge ---------------- */
function s4(lt, A, t) {
  const y = 590, yb = 370;
  dust(line([150, y], [1770, y]), 0, eo(seg(lt, 0, 1.5)), 'blue', t, { n: 420, w: 4, seed: 2, a: A * 0.8 });
  const b1 = bez([520, y], [650, y], [620, yb], [760, yb]);
  const b2 = line([760, yb], [1250, yb]);
  const b3 = bez([1250, yb], [1390, yb], [1360, y], [1500, y]);
  dust(b1, 0, eo(seg(lt, 1.5, 3.2)), 'gold', t, { n: 120, w: 4, seed: 3, a: A, head: true });
  dust(b2, 0, seg(lt, 3.2, 8.8), 'gold', t, { n: 200, w: 4, seed: 4, a: A, head: true });
  dust(b3, 0, eo(seg(lt, 11, 12.6)), 'gold', t, { n: 120, w: 4, seed: 5, a: A, head: true });
  if (lt > 12.6) flow(b3, 'gold', t, A * win(lt, 12.6, 16, 0.5), 5, 0.6, 77);
  [[270, 0.5], [520, 0.8], [760, 1.1], [1050, 7], [1700, 14]].forEach(([x, at]) => cnode(x, y, 'blue', at, lt, A));
  [[920, 3.8], [1090, 6.2], [1250, 8.8]].forEach(([x, at]) => cnode(x, yb, 'gold', at, lt, A));
  cnode(1500, y, 'white', 12.6, lt, A, 9);
  if (lt > 12.6) { const fl = 1 - seg(lt, 12.6, 14.5); dot(1500, y, 260, 'gold', A * fl * 0.5); }

    const x0 = 180 + i * 400, y0 = 230 + (1 - a) * 20, w = 360, h = 340, cx = x0 + w / 2;
    panel(x0, y0, w, h, a, { fill: 'rgba(12,14,32,0.8)', border: 'rgba(200,190,170,0.35)', r: 14 });
    icon(i, cx, y0 + 90, a, t);
    txt(en, cx, y0 + 180, { size: 34, font: SERIF_EN, weight: '600', a, col: '#eef0ff' });
    txt(zh, cx, y0 + 228, { size: 26, a, col: '#f2b56b' });
    strokeLine(cx - 30, y0 + 258, cx + 30, y0 + 258, a * 0.4);
    txt(desc, cx, y0 + 292, { size: 19, a: a * 0.85, col: '#bdb8c9' });
  });
}

/* ---------------- scene 10: finale network ---------------- */
let NET = null;
function buildNet() {
  const nodes = []; let i = 0;
  while (nodes.length < 78 && i < 4000) {
    const p = [120 + R(5000 + i * 2) * 1680, 110 + R(5001 + i * 2) * 690]; i++;
    if (nodes.every(q => Math.hypot(q[0] - p[0], q[1] - p[1]) > 120)) nodes.push(p);
  }
  const maxd = Math.hypot(960, 540);
  const at = nodes.map(p => 0.3 + Math.hypot(p[0] - 960, p[1] - 450) / maxd * 6.5);
  const edges = []; const seen = new Set();
  nodes.forEach((p, a) => {
    const near = nodes.map((q, b) => [b, Math.hypot(q[0] - p[0], q[1] - p[1])]).filter(e => e[0] !== a).sort((x, y) => x[1] - y[1]).slice(0, 3);
    near.forEach(([b, d], k) => { if (k === 2 && R(a * 7 + b) < 0.5) return; const key = a < b ? `${a}-${b}` : `${b}-${a}`; if (!seen.has(key)) { seen.add(key); edges.push([a, b, d]); } });
  });
  NET = { nodes, at, edges };
}
function s10(lt, A, t) {
  const D = 1 - 0.7 * seg(lt, 8.5, 10.5);
  NET.edges.forEach(([a, b, d], k) => {
    const ea = Math.max(NET.at[a], NET.at[b]);
    const p = eo(seg(lt, ea, ea + 1.2)); if (p <= 0) return;
    dust(line(NET.nodes[a], NET.nodes[b]), 0, p, k % 5 === 0 ? 'gold' : 'cyan', t, { n: Math.round(d / 8), w: 3, seed: 7000 + k * 50, a: A * D * 0.65 });
  });
  NET.nodes.forEach((p, k) => cnode(p[0], p[1], k % 6 === 0 ? 'gold' : 'white', NET.at[k], lt, A * D, k % 6 === 0 ? 6 : 4.5));
  particleTitle(TP.title, lt, A * seg(lt, 8.6, 9.4), t, 9, 12, 900);
  dot(960, 450, 520, 'gold', A * seg(lt, 11, 12.5) * 0.1);
  txt('让全世界的人，一起写代码', 960, 640, { size: 28, col: '#d9d1bf', a: A * seg(lt, 11.4, 12.4) });
}

function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  background(t);
  for (const sc of SCENES) {
    if (t < sc.s || t >= sc.e) continue;
    const lt = t - sc.s, A = win(lt, 0, sc.e - sc.s, 0.9);
    sc.f(lt, A, t);
    if (sc.l) label(sc.l[0], sc.l[1], A * seg(lt, 0.4, 1.4));
  }
  vignette();
  for (const [a, b, zh, en] of SUBS) if (t >= a && t < b) subtitle(zh, en, t - a, b - a);
  const fade = Math.max(1 - seg(t, 0, 1.2), seg(t, DURATION - 2, DURATION));
  if (fade > 0) { ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = fade; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
  ctx.globalAlpha = 1;
}

async function init() {
  await Promise.all([
    document.fonts.load(`40px ${SERIF}`, '中文字幕'), document.fonts.load(`600 40px ${SERIF}`, '中文'),
    document.fonts.load(`700 28px ${SERIF}`, '2005'), document.fonts.load(`600 40px ${SERIF_EN}`, 'GitHub'),
    document.fonts.load(`italic 22px ${SERIF_EN}`, 'abc'), document.fonts.load(`18px ${MONO}`, 'git'),
  ]);
  TP.title = makeTextPts('GitHub', 250, 960, 450, 5);
  buildNet();
  window.ready = true;
}
window.renderFrame = renderFrame;
window.DURATION = DURATION;

const params = new URLSearchParams(location.search);
init().then(() => {
  if (params.has('render')) { document.body.classList.add('render'); return; }
  document.body.classList.add('play');
  const t0 = parseFloat(params.get('t') || '0');
  renderFrame(t0);
  const music = document.getElementById('music');
  document.getElementById('start').addEventListener('click', e => {
    e.currentTarget.remove();
    music.currentTime = t0; music.play().catch(() => {});
    const start = performance.now() - t0 * 1000;
    const loop = () => {
      const t = music.paused || music.error ? (performance.now() - start) / 1000 : music.currentTime;
      if (t > DURATION) return;
      renderFrame(t); requestAnimationFrame(loop);
    };
    loop();
  });
});
