<script>
const DURATION = 118, FPS = 30;

/* ---------------- live figure clips (captured by tools/capture.mjs) ---------------- */
const CLIP = {
  sampling: { at: 31.5, n: 510, crop: [140, 1025] },
  watch: { at: 49, n: 570, bright: 2.1, crop: [75, 1080] },
  raptor: { at: 68, n: 570, crop: [80, 975], cropX: [140, 1060], contrast: 1.5, bright: 1.7 },
  'lru-cache': { at: 87, n: 105, crop: [150, 975] },
  'bloom-filter': { at: 90.5, n: 105, crop: [150, 975] },
  'message-queue': { at: 94, n: 105, crop: [150, 975] },
  seasons: { at: 97.5, n: 105, crop: [150, 975], bright: 1.05 },
};
const IMG = {};
function loadImg(src) {
  return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
}
async function clipFrame(name, t) {
  const c = CLIP[name];
  const f = clamp(Math.floor((t - c.at) * FPS), 0, c.n - 1);
  const key = `${name}/${f}`;
  if (!(key in IMG)) IMG[key] = await loadImg(`out/clips/${name}/${String(f).padStart(4, '0')}.jpg`);
  return IMG[key];
}
function drawClip(im, a, o = {}) {
  if (!im || a <= 0) return;
  const { cx = W / 2, cy = 470, h = 940, zoom = 1, bright = 1.55, blur = 0, crop = [0, im.height], cropX = [0, im.width], contrast = 1.12 } = o;
  const s = (h / im.height) * zoom;
  const top = cy + (crop[0] - im.height / 2) * s, hh = (crop[1] - crop[0]) * s;
  const left = cx + (cropX[0] - im.width / 2) * s, ww = (cropX[1] - cropX[0]) * s;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = clamp(a);
  ctx.filter = `brightness(${bright}) contrast(${contrast})${blur ? ` blur(${blur}px)` : ''}`;
  ctx.drawImage(im, cropX[0], crop[0], cropX[1] - cropX[0], crop[1] - crop[0], left, top, ww, hh);
  ctx.restore();
}
function bottomShade(a) {
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = clamp(a);
  const g = ctx.createLinearGradient(0, 760, 0, H);
  g.addColorStop(0, 'rgba(2,2,8,0)'); g.addColorStop(0.45, 'rgba(2,2,8,0.75)'); g.addColorStop(1, 'rgba(2,2,8,0.92)');
  ctx.fillStyle = g; ctx.fillRect(0, 760, W, H - 760);
}

/* ---------------- flashy bits ---------------- */
function flash(t, at, dur = 0.5, col = 'white', peak = 0.55) {
  const a = (1 - seg(t, at, at + dur)) * seg(t, at - 0.06, at) * peak;
  if (a <= 0) return;
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a;
  ctx.fillStyle = col === 'gold' ? 'rgb(255,200,130)' : 'rgb(235,240,255)'; ctx.fillRect(0, 0, W, H);
}
function streak(y, u, a, col = 'gold') {
  if (a <= 0) return;
  const x = lerp(-300, W + 300, u);
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = clamp(a);
  const g = ctx.createLinearGradient(x - 500, 0, x + 120, 0);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.85, rgba(col, 0.9)); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(x - 500, y - 1.5, 620, 3);
  dot(x + 100, y, 60, col, a);
}
function scanlines(a) {
  if (a <= 0) return;
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = a; ctx.fillStyle = '#000';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
}
function promptChip(text, lt, A, y = 74) {
  const a = A * seg(lt, 0, 0.5); if (a <= 0) return;
  const chars = [...text]; const n = Math.min(chars.length, Math.floor(lt * 55));
  ctx.font = `19px ${MONO}`;
  const full = ctx.measureText('> ' + text).width;
  const w = full + 56, x0 = W / 2 - w / 2;
  panel(x0, y - 24, w, 48, a * 0.95, { fill: 'rgba(8,9,20,0.78)', border: 'rgba(242,181,107,0.45)', r: 24 });
  txt('>', x0 + 26, y + 1, { size: 19, font: MONO, col: '#f2b56b', a, align: 'left' });
  const shown = chars.slice(0, n).join('');
  txt(shown, x0 + 50, y + 1, { size: 19, font: MONO, col: '#e8e6f2', a, align: 'left' });
  if (n < chars.length || Math.sin(lt * 9) > 0) {
    const cw = ctx.measureText(shown).width;
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = a * 0.85; ctx.fillStyle = '#f2b56b';
    ctx.fillRect(x0 + 52 + cw, y - 11, 10, 22);
  }
}
function caseCard(num, title, en, lt, A) {
  const a = A * win(lt, 0, 2.2, 0.35); if (a <= 0) return;
  const u = eo(seg(lt, 0, 0.9));
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = a * 0.55; ctx.fillStyle = '#020208'; ctx.fillRect(0, 0, W, H);
  txt(num, W / 2 - 60 + (1 - u) * -80, 470, { size: 230, font: SERIF_EN, weight: '700', col: 'rgba(242,181,107,0.95)', a, align: 'right' });
  txt('CASE', W / 2 - 30 + (1 - u) * 60, 395, { size: 24, font: SERIF_EN, col: '#bdb8c9', a, align: 'left' });
  txt(title, W / 2 - 30 + (1 - u) * 60, 462, { size: 56, weight: '600', col: '#f3eee2', a, align: 'left' });
  txt(en, W / 2 - 30 + (1 - u) * 60, 526, { size: 22, font: SERIF_EN, italic: true, col: '#aaa6bb', a, align: 'left' });
  streak(590, seg(lt, 0.05, 1.1), a);
}

/* ---------------- scene 1: boxes & arrows → particles ---------------- */
const BOXES = [[420, 'Client'], [960, 'Cache'], [1500, 'Database']];
let DIAG = null;
function buildDiag() {
  const pts = [];
  BOXES.forEach(([cx]) => {
    const x0 = cx - 150, y0 = 380, w = 300, h = 150;
    for (let s = 0; s < 1; s += 0.004) {
      const p = s * 2 * (w + h);
      let x, y;
      if (p < w) { x = x0 + p; y = y0; } else if (p < w + h) { x = x0 + w; y = y0 + p - w; } else if (p < 2 * w + h) { x = x0 + w - (p - w - h); y = y0 + h; } else { x = x0; y = y0 + h - (p - 2 * w - h); }
      pts.push([x, y]);
    }
  });
  for (const ax of [655, 1195]) for (let x = 0; x < 70; x += 2.5) pts.push([ax + x, 455]);
  DIAG = pts;
}
function s1(lt, A, t) {
  const shatter = seg(lt, 7.6, 9.6);
  const da = A * seg(lt, 0.4, 1.4) * (1 - seg(lt, 7.6, 8));
  if (da > 0) {
    BOXES.forEach(([cx, name], k) => {
      const ap = seg(lt, 0.4 + k * 0.5, 1.2 + k * 0.5);
      panel(cx - 150, 380, 300, 150, da * ap, { fill: 'rgba(20,22,36,0.6)', border: 'rgba(190,190,205,0.55)', r: 4, lw: 1.5 });
      txt(name, cx, 455, { size: 30, font: SERIF_EN, col: '#c9c6d4', a: da * ap });
    });
    [655, 1195].forEach((x, k) => {
      const ap = seg(lt, 1.6 + k * 0.5, 2.2 + k * 0.5);
      strokeLine(x, 455, x + 70 * ap, 455, da * ap, 'rgba(190,190,205,0.8)', 2);
      if (ap >= 1) {
        ctx.beginPath(); ctx.moveTo(x + 70, 455); ctx.lineTo(x + 58, 448); ctx.lineTo(x + 58, 462); ctx.closePath();
        ctx.fillStyle = 'rgba(190,190,205,0.8)'; ctx.fill();
      }
    });
    const q = da * win(lt, 5, 7.6, 0.4);
    txt('?', 960, 300, { size: 90, font: SERIF_EN, col: '#f2b56b', a: q * (0.7 + 0.3 * Math.sin(t * 6)) });
  }
  if (lt > 7.6) {
    const pts = TP.title;
    for (let i = 0; i < pts.length; i++) {
      const src = DIAG[i % DIAG.length];
      const d = R(300 + i * 3);
      const burst = eo(seg(lt, 7.6, 8.6));
      const ang = R(301 + i * 3) * 6.283, rr = burst * (80 + d * 260);
      const bx = src[0] + Math.cos(ang) * rr, by = src[1] + Math.sin(ang) * rr * 0.7;
      const arr = eio(seg(lt, 8.4 + d * 1.6, 10.6 + d * 1.4));
      const x = lerp(bx, pts[i][0], arr), y = lerp(by, pts[i][1], arr);
      const tw = 0.6 + 0.4 * Math.sin(t * 2.5 + i);
      dot(x, y, 2.6 + (1 - arr) * 1.5, arr > 0.9 ? (R(i * 3) < 0.7 ? 'gold' : 'white') : (R(i * 7) < 0.5 ? 'blue' : 'cyan'), A * tw * (0.35 + 0.5 * Math.max(arr, 1 - burst * 0.6)));
    }
  }
}

/* ---------------- scene 2: title + prompt ---------------- */
function s2(lt, A, t) {
  const pts = TP.title;
  for (let i = 0; i < pts.length; i++) {
    const tw = 0.6 + 0.4 * Math.sin((lt + 12) * 2.5 + i);
    const drift = Math.sin(t * 0.7 + i) * 1.2;
    dot(pts[i][0] + drift, pts[i][1], 3.2, R(i * 3) < 0.7 ? 'gold' : 'white', A * tw * 0.85);
  }
  dot(960, 410, 560, 'gold', A * 0.1 * (0.8 + 0.2 * Math.sin(t * 1.3)));
  txt('一个 Claude Code Skill', 960, 560, { size: 30, col: '#e2dccd', a: A * seg(lt, 0.8, 1.8) });
  txt('A SKILL FOR CLAUDE CODE  ·  BY RYAN (@wheresryan22)', 960, 604, { size: 16, col: '#9d98a8', a: A * seg(lt, 1.2, 2.2), font: SERIF_EN });
  if (lt > 4.6) promptChip('/anatomy explain how an LRU cache evicts entries, interactive', lt - 4.6, A, 700);
  if (lt > 8.6) {
    const a = A * seg(lt, 8.6, 9.4);
    txt('Claude 发明的机器：', 760, 780, { size: 22, col: '#bdb8c9', a, align: 'right' });
    txt('一个书架 —— 最近用过的书放最左边', 780, 780, { size: 24, col: '#f2b56b', a, align: 'left' });
  }
}

/* ---------------- scene 3: how it works – an isometric machine assembling ---------------- */
const ISO = { cx: 1240, cy: 520, s: 1.35 };
const iso = (x, y, z) => [ISO.cx + (x - y) * 0.866 * ISO.s, ISO.cy + (x + y) * 0.5 * ISO.s - z * ISO.s];
function poly(pts, fill, stroke, a, lw = 1) {
  if (a <= 0) return;
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = clamp(a);
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke();
}
function isoBox(x, y, z, dx, dy, dz, a, lit = false) {
  const st = lit ? 'rgba(255,214,160,0.95)' : 'rgba(200,205,225,0.75)';
  poly([iso(x, y + dy, z), iso(x + dx, y + dy, z), iso(x + dx, y + dy, z + dz), iso(x, y + dy, z + dz)], lit ? '#7a5228' : '#15161f', st, a);
  poly([iso(x + dx, y, z), iso(x + dx, y + dy, z), iso(x + dx, y + dy, z + dz), iso(x + dx, y, z + dz)], lit ? '#9a6a35' : '#1c1d29', st, a);
  poly([iso(x, y, z + dz), iso(x + dx, y, z + dz), iso(x + dx, y + dy, z + dz), iso(x, y + dy, z + dz)], lit ? '#d39a55' : '#262838', st, a);
}
function isoCyl(x, y, z, r, h, a, lit = false, teeth = 0, rot = 0) {
  const st = lit ? 'rgba(255,214,160,0.95)' : 'rgba(200,205,225,0.75)';
  const ring = (zz, rr) => Array.from({ length: 48 }, (_, i) => { const t = i / 48 * 6.283; return iso(x + Math.cos(t) * rr, y + Math.sin(t) * rr, zz); });
  const bot = ring(z, r), top = ring(z + h, r);
  const side = [];
  for (let i = 0; i < 48; i++) { const t = i / 48 * 6.283; if (Math.cos(t - 0.785) > -0.05) side.push(i); }
  poly([...side.map(i => bot[i]), ...side.slice().reverse().map(i => top[i])], lit ? '#9a6a35' : '#1a1b27', st, a);
  poly(top, lit ? '#d39a55' : '#262838', st, a);
  if (teeth) {
    for (let k = 0; k < teeth; k++) {
      const t = k / teeth * 6.283 + rot;
      const p1 = iso(x + Math.cos(t) * r, y + Math.sin(t) * r, z + h), p2 = iso(x + Math.cos(t) * (r + 6), y + Math.sin(t) * (r + 6), z + h);
      strokeLine(p1[0], p1[1], p2[0], p2[1], a, st, 2);
    }
    const c = iso(x, y, z + h); dot(c[0], c[1], 6, 'white', a * 0.6);
  }
}
const PARTS = [
  a => isoBox(-120, -90, 0, 240, 180, 14, a),
  ...[[-110, -80], [100, -80], [-110, 70], [100, 70]].map(([x, y]) => a => isoCyl(x, y, -12, 7, 12, a)),
  a => isoBox(-100, -70, 14, 30, 30, 120, a),
  a => isoBox(70, -70, 14, 30, 30, 120, a),
  a => isoBox(-100, -70, 134, 200, 30, 18, a),
  (a, t) => isoCyl(-40, 30, 14, 34, 16, a, false, 16, t * 0.8),
  (a, t) => isoCyl(30, 30, 14, 22, 26, a, false, 11, -t * 1.24),
  a => isoBox(-20, -55, 70, 40, 8, 40, a),
  (a, t) => isoCyl(70, 40, 14, 18, 44, a, true),
];
function s3(lt, A, t) {
  const steps = [['01', '先找真实数字', 'Truth first'], ['02', '发明一台机器', 'Invent the object'], ['03', '至少 40 个零件', 'List 40+ parts'], ['04', '像评论家一样验收', 'Verify like a critic']];
  steps.forEach(([n, zh, en], k) => {
    const at = 0.6 + k * 2.3, a = A * eo(seg(lt, at, at + 0.6)), on = lt >= at && lt < at + 2.3;
    const y = 300 + k * 120;
    txt(n, 250, y, { size: 44, font: SERIF_EN, weight: '700', col: on ? '#f2b56b' : 'rgba(242,181,107,0.45)', a, align: 'left' });
    txt(zh, 340, y - 8, { size: 34, col: on ? '#f6f1e5' : '#a9a4b5', a, align: 'left', weight: on ? '600' : '' });
    txt(en, 340, y + 30, { size: 17, font: SERIF_EN, italic: true, col: '#8e8a9c', a, align: 'left' });
    if (on) strokeLine(230, y + 52, 230 + 380 * seg(lt, at, at + 2.3), y + 52, a * 0.6, 'rgba(242,181,107,1)', 1.5);
  });
  const ga = A * seg(lt, 1, 2);
  for (let gx = -160; gx <= 160; gx += 20) { const p = iso(gx, -130, 0), q = iso(gx, 130, 0); strokeLine(p[0], p[1], q[0], q[1], ga * 0.08, 'rgba(150,170,255,1)'); }
  for (let gy = -130; gy <= 130; gy += 20) { const p = iso(-160, gy, 0), q = iso(160, gy, 0); strokeLine(p[0], p[1], q[0], q[1], ga * 0.08, 'rgba(150,170,255,1)'); }
  let built = 0;
  PARTS.forEach((draw, k) => {
    const at = 2.6 + k * 0.42, p = eo(seg(lt, at, at + 0.5));
    if (p <= 0) return;
    built = k + 1;
    ctx.save(); ctx.translate(0, -(1 - p) * 120); draw(A * p, t); ctx.restore();
    if (p < 1) { const c = iso(0, 0, 60); dot(c[0], c[1] - (1 - p) * 120, 120, 'gold', A * (1 - p) * 0.25); }
  });
  const count = Math.min(48, Math.round(built / PARTS.length * 48 * seg(lt, 2.6, 7.8) + (lt > 7.8 ? 0 : 0)));
  txt(`parts  ${String(count).padStart(2, '0')} / 40+`, ISO.cx + 330, 760, { size: 18, font: MONO, col: '#bdb8c9', a: A * seg(lt, 2.6, 3.2), align: 'right' });
  const crit = seg(lt, 7.6, 8.2) * A;
  if (crit > 0) {
    const sx = ISO.cx - 60 + Math.sin(lt * 1.7) * 90, sy = 470 + Math.cos(lt * 1.3) * 50;
    panel(sx - 70, sy - 70, 140, 140, crit * 0.9, { fill: 'rgba(0,0,0,0)', border: 'rgba(242,181,107,0.9)', r: 70, lw: 2 });
    txt('4×', sx + 62, sy - 62, { size: 18, font: SERIF_EN, weight: '700', col: '#f2b56b', a: crit, align: 'left' });
  }
}

/* ---------------- cases ---------------- */
function caseScene(name, num, title, en, prompt, badge) {
  return async (lt, A, t) => {
    const im = await clipFrame(name, t);
    const zoom = 1.06 - 0.06 * eo(seg(lt, 0, 3));
    const o = name === 'raptor' ? { h: 880, cy: 455, zoom } : { h: 1080, cy: 540, zoom: zoom * 1.0 };
    o.bright = CLIP[name].bright || 1.55; o.crop = CLIP[name].crop; o.cropX = CLIP[name].cropX; o.contrast = CLIP[name].contrast;
    drawClip(im, A * seg(lt, 0.9, 2), o);
    bottomShade(A);
    if (lt > 2) promptChip(prompt, lt - 2, A * (1 - seg(lt, 9, 10)) );
    if (badge && lt > 9.4) {
      const a = A * win(lt, 9.4, 17.5, 0.5);
      badge.forEach((b, k) => {
        const x = 1580, y = 300 + k * 70, ap = a * eo(seg(lt, 9.4 + k * 0.25, 10 + k * 0.25));
        strokeLine(x - 14, y - 18, x - 14, y + 18, ap * 0.8, 'rgba(242,181,107,1)', 2);
        txt(b[0], x, y - 6, { size: 30, font: SERIF_EN, weight: '700', col: '#f2b56b', a: ap, align: 'left' });
        txt(b[1], x, y + 22, { size: 16, col: '#bdb8c9', a: ap, align: 'left' });
      });
    }
    caseCard(num, title, en, lt, A);
  };
}
const s4 = caseScene('sampling', '01', '温度 → 轮盘赌', 'Sampling temperature, as a roulette wheel',
  '/anatomy explain how temperature changes how a language model picks the next token, interactive',
  [['16', '个格子 = 16 个候选词'], ['T', '温度旋钮实时改变概率'], ['1', '句话生成']]);
const s5 = caseScene('watch', '02', '机械表机芯', 'A Swiss automatic movement, 25.6 mm',
  '/anatomy explain how a mechanical watch keeps time, interactive',
  [['1h 54m', 'Claude 独立工作，一次成型'], ['4 Hz', '摆轮频率 · 28,800 次/小时'], ['1/100', '慢放，看擒纵叉放过半个齿']]);
const s6 = caseScene('raptor', '03', '猛禽 2 发动机', 'SpaceX Raptor 2, full-flow staged combustion',
  'Raptor 2 · test stand · hover to take apart · I to ignite',
  [['11', '个组件，可逐层拆解'], ['300 bar', '主燃烧室压力'], ['WebGL', '火焰与蒸汽在同一视角']]);

const MONTAGE = [
  ['lru-cache', 'LRU 缓存', '书架'], ['bloom-filter', '布隆过滤器', '老虎机'],
  ['message-queue', '消息队列', '弹珠轨道'], ['seasons', '四季成因', '3D 地球仪'],
];
async function s7(lt, A, t) {

}

/* ---------------- scene 8: install + end title ---------------- */
function s8(lt, A, t) {
  const a1 = A * (1 - seg(lt, 6.6, 7.4));
  if (a1 > 0) {
    promptChip('npx skills add wheresryan22/anatomy', lt - 0.4, a1, 420);
    ['Claude Code', 'Codex', 'OpenCode', 'Antigravity'].forEach((n, k) => {

      panel(x - 100, 500, 200, 54, a, { fill: 'rgba(14,16,34,0.8)', border: 'rgba(170,185,255,0.4)', r: 27 });
      txt(n, x, 527, { size: 21, font: SERIF_EN, col: '#dfe2f5', a });
    });
    txt('SVG  ·  WebGL  ·  3D  ·  React  ·  深色 / 浅色', 960, 610, { size: 18, col: '#9d98a8', a: a1 * seg(lt, 3, 4), font: SERIF_EN });
  }
  if (lt > 6.4) {
    particleTitle(TP.title, lt, A, t, 6.4, 9.4, 900);

async function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  background(t);
  for (const sc of SCENES) {
    if (t < sc.s || t >= sc.e) continue;
    const lt = t - sc.s, dur = sc.e - sc.s;
    const A = Math.min(sc.fadeIn ? 1 : seg(lt, 0, 0.5), 1 - seg(lt, dur - 0.5, dur));
    await sc.f(lt, A, t);
    if (sc.l) label(sc.l[0], sc.l[1], A * seg(lt, 0.4, 1.2));
  }
  vignette();
  for (const [a, b, zh, en] of SUBS) if (t >= a && t < b) subtitle(zh, en, t - a, b - a);
  for (const [at, col, pk] of FLASHES) flash(t, at, 0.5, col, pk);
  const fade = Math.max(1 - seg(t, 0, 0.8), seg(t, DURATION - 1.6, DURATION));
  if (fade > 0) { ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = fade; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
  ctx.globalAlpha = 1;
}

async function init() {
  await Promise.all([
    document.fonts.load(`40px ${SERIF}`, '中文字幕'), document.fonts.load(`600 40px ${SERIF}`, '中文'),
    document.fonts.load(`700 28px ${SERIF}`, 'CASE'), document.fonts.load(`600 40px ${SERIF_EN}`, 'Anatomy'),
    document.fonts.load(`700 40px ${SERIF_EN}`, '01'), document.fonts.load(`italic 22px ${SERIF_EN}`, 'abc'),
    document.fonts.load(`18px ${MONO}`, 'npx'),
  ]);
  TP.title = makeTextPts('Anatomy', 230, 960, 410, 5);
  buildDiag();
  window.ready = true;
}
window.renderFrame = renderFrame;
window.DURATION = DURATION;
init().then(async () => {
  const q = new URLSearchParams(location.search);
  if (q.has('render')) return;
  document.body.classList.add('play');
  const start = performance.now() - (parseFloat(q.get('t') || '0')) * 1000;
  let busy = false;
  const loop = async () => {
    const t = (performance.now() - start) / 1000;
    if (t > DURATION) return;
    if (!busy) { busy = true; await renderFrame(t); busy = false; }
    requestAnimationFrame(loop);
  };
  loop();
});
