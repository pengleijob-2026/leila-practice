<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#0b0b0d;height:100%;overflow:hidden}
  #f{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
</style></head>
<body><div id="f"></div>
<script type="module">
const q = new URLSearchParams(location.search);
const name = q.get('name') || 'watch';
const w = +(q.get('w') || 1100);
const m = await import(`/node_modules/anatomy-figures/dist/element/${name}.js`);
const el = document.getElementById('f');
const [rw, rh] = (m.ratio || '1 / 1').split('/').map(Number);
el.style.width = w + 'px';
el.style.height = Math.round(w * rh / rw) + 'px';
const fit = Math.min(1, (innerHeight * 0.96) / (w * rh / rw));
el.style.transform = `translate(-50%,-50%) scale(${fit})`;
const tokens = { '--anatomy-card': '#0b0b0d', '--anatomy-paper': '#0b0b0d' };
if (q.get('lit')) tokens['--anatomy-lit'] = q.get('lit');
m.render(el, { theme: q.get('theme') || 'dark', tokens });
window.figReady = true;
</script></body></html>
