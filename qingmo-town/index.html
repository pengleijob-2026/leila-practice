<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { Reflector } from "three/addons/objects/Reflector.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";
import { FullScreenQuad } from "three/addons/postprocessing/Pass.js";

const params = new URLSearchParams(location.search);
const MOBILE = matchMedia("(pointer: coarse)").matches || Math.min(innerWidth, innerHeight) < 600;

// ---------------- seeded random ----------------
let seed = 20260419;
const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const rr = (a, b) => a + (b - a) * rand();
const pick = arr => arr[Math.floor(rand() * arr.length)];

// ---------------- renderer / scene ----------------
const canvas = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const FOG = new THREE.Color("#e9e4d8");
scene.fog = new THREE.FogExp2(FOG, 0.0085);
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 900);

// ---------------- canvas texture helpers ----------------
function cnv(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return [c, c.getContext("2d")]; }
function tex(c, repeat = true, srgb = true) {
  const t = new THREE.CanvasTexture(c);
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function noiseSpeckle(g, w, h, n, a, dark = true) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = dark ? `rgba(40,36,30,${rr(0, a)})` : `rgba(255,252,240,${rr(0, a)})`;
    g.fillRect(rand() * w, rand() * h, rr(1, 3), rr(1, 3));
  }
}
// low-frequency blotches
function blotches(g, w, h, n, col, aMax, rMin, rMax) {
  for (let i = 0; i < n; i++) {
    const x = rand() * w, y = rand() * h, r = rr(rMin, rMax);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${col},${rr(aMax * 0.3, aMax)})`); gr.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
}

// whitewashed wall with age stains, rain streaks and damp grime at the foot
function wallTexture() {
  const [c, g] = cnv(1024, 1024);
  g.fillStyle = "#efe9dc"; g.fillRect(0, 0, 1024, 1024);
  blotches(g, 1024, 1024, 70, "150,140,120", 0.10, 30, 160);
  blotches(g, 1024, 1024, 40, "255,252,244", 0.18, 40, 140);
  for (let i = 0; i < 90; i++) {
    const x = rand() * 1024, y0 = rand() * 900, len = rr(60, 380), w = rr(3, 18);
    const gr = g.createLinearGradient(0, y0, 0, y0 + len);
    gr.addColorStop(0, `rgba(95,92,84,${rr(0.05, 0.16)})`); gr.addColorStop(1, "rgba(95,92,84,0)");
    g.fillStyle = gr; g.fillRect(x, y0, w, len);
  }
  const gr = g.createLinearGradient(0, 1024, 0, 820);
  gr.addColorStop(0, "rgba(92,96,82,0.55)"); gr.addColorStop(0.5, "rgba(110,110,96,0.25)"); gr.addColorStop(1, "rgba(110,110,96,0)");
  g.fillStyle = gr; g.fillRect(0, 820, 1024, 204);
  noiseSpeckle(g, 1024, 1024, 9000, 0.08);
  return tex(c);
}
function flagstoneTexture(base, gap, rows = 8) {
  const [c, g] = cnv(1024, 1024);
  g.fillStyle = gap; g.fillRect(0, 0, 1024, 1024);
  const rh = 1024 / rows;
  for (let r = 0; r < rows; r++) {
    let x = -rr(0, 120);
    while (x < 1024) {
      const w = rr(110, 230), l = rr(-14, 14);
      const [br, bg, bb] = base;
      g.fillStyle = `rgb(${br + l},${bg + l},${bb + l - 2})`;
      g.beginPath(); g.roundRect(x + 3, r * rh + 3, w - 6, rh - 6, 6); g.fill();
      x += w;
    }
  }
  blotches(g, 1024, 1024, 60, "60,60,52", 0.12, 20, 120);
  blotches(g, 1024, 1024, 30, "235,230,215", 0.10, 30, 120);
  noiseSpeckle(g, 1024, 1024, 14000, 0.12);
  return tex(c);
}
function embankTexture() {
  const [c, g] = cnv(512, 512);
  g.fillStyle = "#4f504a"; g.fillRect(0, 0, 512, 512);
  const rows = 6, rh = 512 / rows;
  for (let r = 0; r < rows; r++) {
    let x = -rr(0, 80);
    while (x < 512) {
      const w = rr(70, 150), l = rr(-16, 16);
      g.fillStyle = `rgb(${120 + l},${120 + l},${112 + l})`;
      g.beginPath(); g.roundRect(x + 2, r * rh + 2, w - 4, rh - 4, 8); g.fill();
      x += w;
    }
  }
  const gr = g.createLinearGradient(0, 512, 0, 250);
  gr.addColorStop(0, "rgba(70,84,60,0.75)"); gr.addColorStop(1, "rgba(70,84,60,0)");
  g.fillStyle = gr; g.fillRect(0, 250, 512, 262);
  blotches(g, 512, 512, 40, "60,70,50", 0.2, 10, 60);
  noiseSpeckle(g, 512, 512, 6000, 0.14);
  return tex(c);
}
function tileTexture() {
  const [c, g] = cnv(256, 256);
  g.fillStyle = "#525254"; g.fillRect(0, 0, 256, 256);
  for (let x = 0; x < 256; x += 16) {
    const gr = g.createLinearGradient(x, 0, x + 16, 0);
    gr.addColorStop(0, "#2f2f31"); gr.addColorStop(0.35, "#5c5c5e"); gr.addColorStop(0.7, "#48484a"); gr.addColorStop(1, "#2f2f31");
    g.fillStyle = gr; g.fillRect(x, 0, 16, 256);
  }
  for (let y = 0; y < 256; y += 22) { g.fillStyle = "rgba(20,20,22,0.35)"; g.fillRect(0, y, 256, 2); }
  noiseSpeckle(g, 256, 256, 2500, 0.15);
  return tex(c);
}
function latticeTexture() {
  const [c, g] = cnv(128, 128);
  g.fillStyle = "#1f1b18"; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = "#5a4a3d"; g.lineWidth = 5; g.strokeRect(4, 4, 120, 120);
  g.lineWidth = 3;
  for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(k * 32, 6); g.lineTo(k * 32, 122); g.stroke(); g.beginPath(); g.moveTo(6, k * 32); g.lineTo(122, k * 32); g.stroke(); }
  return tex(c, false);
}
function doorTexture() {
  const [c, g] = cnv(128, 256);
  g.fillStyle = "#3a2f28"; g.fillRect(0, 0, 128, 256);
  g.fillStyle = "#2a221d"; g.fillRect(62, 0, 4, 256);
  for (let y = 0; y < 256; y += 9) { g.fillStyle = `rgba(0,0,0,${rr(0.05, 0.15)})`; g.fillRect(0, y, 128, 1); }
  g.fillStyle = "#6a5a40"; g.beginPath(); g.arc(54, 130, 4, 0, 7); g.arc(74, 130, 4, 0, 7); g.fill();
  noiseSpeckle(g, 128, 256, 600, 0.2);
  return tex(c, false);
}
function leafStripTexture() {
  const [c, g] = cnv(64, 512);
  g.clearRect(0, 0, 64, 512);
  g.strokeStyle = "rgba(120,130,70,1)"; g.lineWidth = 2; g.beginPath(); g.moveTo(32, 0); g.lineTo(32, 512); g.stroke();
  for (let y = 6; y < 506; y += 9) {
    const side = (y / 9) % 2 ? 1 : -1, len = rr(12, 20) * (0.6 + 0.4 * Math.sin(y / 512 * Math.PI));
    g.save(); g.translate(32, y); g.rotate(side * rr(0.35, 0.6));
    g.fillStyle = `rgba(255,255,255,${rr(0.85, 1)})`;
    g.beginPath(); g.ellipse(side * len / 2, 3, len / 2, 2.6, 0, 0, Math.PI * 2); g.fill();
    g.restore();
  }
  const t = tex(c, false, true); t.generateMipmaps = true; return t;
}
function softDot(color = "255,255,255", petal = false) {
  const [c, g] = cnv(64, 64);
  if (petal) {
    for (let k = 0; k < 5; k++) {
      g.save(); g.translate(32, 32); g.rotate(k * Math.PI * 2 / 5);
      const gr = g.createRadialGradient(0, -12, 0, 0, -12, 14);
      gr.addColorStop(0, `rgba(${color},1)`); gr.addColorStop(1, `rgba(${color},0)`);
      g.fillStyle = gr; g.beginPath(); g.ellipse(0, -12, 10, 13, 0, 0, 7); g.fill(); g.restore();
    }
  } else {
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `rgba(${color},1)`); gr.addColorStop(0.5, `rgba(${color},0.5)`); gr.addColorStop(1, `rgba(${color},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  }
  return tex(c, false);
}
function grassTexture() {
  const [c, g] = cnv(128, 128);
  for (let i = 0; i < 26; i++) {
    const x = rr(20, 108), h = rr(40, 120), bend = rr(-26, 26);
    g.strokeStyle = `rgba(${rr(80, 120) | 0},${rr(110, 140) | 0},${rr(60, 80) | 0},1)`; g.lineWidth = rr(2, 4);
    g.beginPath(); g.moveTo(x, 128); g.quadraticCurveTo(x + bend * 0.3, 128 - h * 0.6, x + bend, 128 - h); g.stroke();
  }
  return tex(c, false);
}
function mistTexture() {
  const [c, g] = cnv(512, 128);
  for (let i = 0; i < 70; i++) {
    const x = rand() * 512, y = rr(30, 100), r = rr(20, 70);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(255,255,255,${rr(0.15, 0.4)})`); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
    g.fillRect(x - r - 512, y - r, r * 2, r * 2); g.fillRect(x - r + 512, y - r, r * 2, r * 2);
  }
  const t = tex(c); t.wrapT = THREE.ClampToEdgeWrapping; return t;
}
function paperNoise() {
  const [c, g] = cnv(512, 512);
  const id = g.createImageData(512, 512);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (rand() - 0.5) * 90; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0);
  g.globalAlpha = 0.25;
  for (let i = 0; i < 500; i++) { g.strokeStyle = rand() < 0.5 ? "#fff" : "#000"; g.lineWidth = rr(0.4, 1.2); g.beginPath(); const x = rand() * 512, y = rand() * 512, a = rand() * 7, l = rr(6, 30); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + rr(-5, 5), y + Math.sin(a) * l * 0.5 + rr(-5, 5), x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  return tex(c, true, false);
}

// ink-wash mountain silhouette with a soft misty foot
function mountainTexture(colorTop, peaks, roughness, inkAmount) {
  const W = 2048, H = 512, [c, g] = cnv(W, H);
  const ridge = new Float32Array(W);
  for (let x = 0; x < W; x++) {
    let y = 0;
    peaks.forEach(([px, ph, pw]) => { const d = Math.abs(x - px * W) / (pw * W); y = Math.max(y, ph * Math.exp(-Math.pow(d, 1.25) * 2.4)); });
    let n = 0, amp = roughness, f = 0.006;
    for (let o = 0; o < 6; o++) { n += (1 - Math.abs(Math.sin(x * f + o * 13.7 + Math.sin(x * f * 0.6 + o * 3.1) * 1.7))) * amp; amp *= 0.52; f *= 2.05; }
    ridge[x] = H - (y * (0.82 + n * 1.2) + n * 0.35 + 0.06) * H;
  }
  for (let x = 0; x < W; x++) {
    const top = ridge[x];
    const gr = g.createLinearGradient(0, top, 0, H);
    gr.addColorStop(0, `rgba(${colorTop},0.95)`); gr.addColorStop(0.35, `rgba(${colorTop},0.6)`); gr.addColorStop(0.8, `rgba(${colorTop},0.0)`);
    g.fillStyle = gr; g.fillRect(x, top, 1, H - top);
  }
  // ink texture strokes (cun) following the slopes
  g.globalCompositeOperation = "source-atop";
  for (let i = 0; i < 900 * inkAmount; i++) {
    const x = rand() * W, top = ridge[Math.floor(x)];
    const y = top + rr(0, 120);
    g.strokeStyle = `rgba(60,66,74,${rr(0.04, 0.16)})`; g.lineWidth = rr(1, 4);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + rr(-20, 20), y + rr(15, 60)); g.stroke();
  }
  g.globalCompositeOperation = "source-over";
  g.strokeStyle = `rgba(70,76,84,${0.35 * inkAmount})`; g.lineWidth = 2;
  g.beginPath(); for (let x = 0; x < W; x += 2) { x ? g.lineTo(x, ridge[x] + 1) : g.moveTo(x, ridge[x] + 1); } g.stroke();
  const t = tex(c, false); t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; return t;
}
function skyTexture() {
  const [c, g] = cnv(1024, 1024);
  const gr = g.createLinearGradient(0, 0, 0, 1024);
  gr.addColorStop(0, "#b9c3c8"); gr.addColorStop(0.35, "#cfd4d3"); gr.addColorStop(0.62, "#e7e3d8"); gr.addColorStop(1, "#ece6da");
  g.fillStyle = gr; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 160; i++) {
    const x = rr(-50, 1074), y = rr(380, 620) - Math.abs(x - 512) * 0.12, r = rr(30, 110);
    const gg = g.createRadialGradient(x, y, 0, x, y, r);
    gg.addColorStop(0, `rgba(250,248,242,${rr(0.15, 0.4)})`); gg.addColorStop(1, "rgba(250,248,242,0)");
    g.fillStyle = gg; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const t = tex(c, false); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// ---------------- materials ----------------
const TEX = {
  wall: wallTexture(), path: flagstoneTexture([150, 146, 136], "#5d5a52"), ground: flagstoneTexture([132, 129, 120], "#55524a", 10),
  bank: embankTexture(), tile: tileTexture(), lattice: latticeTexture(), door: doorTexture(),
  leaf: leafStripTexture(), dot: softDot(), petal: softDot("255,255,255", true), grass: grassTexture(), mist: mistTexture(), paper: paperNoise()
};
const M = {
  wall: new THREE.MeshStandardMaterial({ map: TEX.wall, color: "#fbf8f0", roughness: 0.96 }),
  plinth: new THREE.MeshStandardMaterial({ map: TEX.bank, color: "#b8b5aa", roughness: 1 }),
  roof: new THREE.MeshStandardMaterial({ map: TEX.tile, color: "#8a8a8e", roughness: 0.9 }),
  cap: new THREE.MeshStandardMaterial({ map: TEX.tile, color: "#5a5a5e", roughness: 0.9 }),
  wood: new THREE.MeshStandardMaterial({ color: "#3d322b", roughness: 0.85 }),
  door: new THREE.MeshStandardMaterial({ map: TEX.door, roughness: 0.85 }),
  window: new THREE.MeshStandardMaterial({ map: TEX.lattice, roughness: 0.85 }),
  red: new THREE.MeshStandardMaterial({ color: "#a8402f", roughness: 0.9 }),
  stoneFrame: new THREE.MeshStandardMaterial({ color: "#9c9a92", roughness: 1, side: THREE.DoubleSide }),
  path: new THREE.MeshStandardMaterial({ map: TEX.path, roughness: 0.97, side: THREE.DoubleSide }),
  ground: new THREE.MeshStandardMaterial({ map: TEX.ground, roughness: 0.97, side: THREE.DoubleSide }),
  bank: new THREE.MeshStandardMaterial({ map: TEX.bank, roughness: 1, side: THREE.DoubleSide }),
  bark: new THREE.MeshStandardMaterial({ color: "#4a433b", roughness: 1 }),
  barkLight: new THREE.MeshStandardMaterial({ color: "#4a423a", roughness: 1 })
};

// ---------------- river course ----------------
const river = new THREE.CatmullRomCurve3([
  [2, 46], [0, 24], [-3, 8], [-2, -8], [3, -26], [8, -44], [6, -62], [-1, -80], [-7, -100], [-9, -124], [-6, -150], [0, -180], [6, -215]
].map(([x, z]) => new THREE.Vector3(x, 0, z)), false, "catmullrom", 0.5);
const RIVER_LEN = river.getLength();
const HALF_W = 5.2, PATH_Y = 1.0;
const PATH_W = { "1": 6.0, "-1": 3.6 };     // side +1 = left bank (wide promenade), -1 = right bank
const SAMPLES = 600;
const RP = river.getSpacedPoints(SAMPLES);
const RT = RP.map((p, i) => river.getTangentAt(i / SAMPLES).normalize());
const leftN = t => new THREE.Vector3(t.z, 0, -t.x);   // left of the flow direction (camera looks upstream toward -z)
function frameAt(s) {   // s = arclength
  const u = THREE.MathUtils.clamp(s / RIVER_LEN, 0, 1);
  const p = river.getPointAt(u), t = river.getTangentAt(u).normalize();
  return { p, t, n: leftN(t) };
}
function bankPoint(s, side, off, y = PATH_Y) { const f = frameAt(s); return f.p.clone().addScaledVector(f.n, side * off).setY(y); }

// ribbon following the river at offsets [a,b] from the centre line
function ribbon(side, a, b, y, uvSize) {
  const pos = [], uv = [], idx = [];
  let acc = 0;
  for (let i = 0; i <= SAMPLES; i++) {
    if (i) acc += RP[i].distanceTo(RP[i - 1]);
    const n = leftN(RT[i]);
    const pa = RP[i].clone().addScaledVector(n, side * a), pb = RP[i].clone().addScaledVector(n, side * b);
    pos.push(pa.x, y, pa.z, pb.x, y, pb.z);
    uv.push(a / uvSize, acc / uvSize, b / uvSize, acc / uvSize);
    if (i) { const k = i * 2; side > 0 ? idx.push(k - 2, k - 1, k, k - 1, k + 1, k) : idx.push(k - 2, k, k - 1, k - 1, k, k + 1); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function wallRibbon(side, off, y0, y1, uvSize) {
  const pos = [], uv = [], idx = [];
  let acc = 0;
  for (let i = 0; i <= SAMPLES; i++) {
    if (i) acc += RP[i].distanceTo(RP[i - 1]);
    const n = leftN(RT[i]), p = RP[i].clone().addScaledVector(n, side * off);
    pos.push(p.x, y0, p.z, p.x, y1, p.z);
    uv.push(acc / uvSize, y0 / uvSize, acc / uvSize, y1 / uvSize);
    if (i) { const k = i * 2; side > 0 ? idx.push(k - 2, k, k - 1, k - 1, k, k + 1) : idx.push(k - 2, k - 1, k, k - 1, k + 1, k); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
for (const side of [-1, 1]) {
  const pw = PATH_W[side];
  const path = new THREE.Mesh(ribbon(side, HALF_W + 0.35, HALF_W + pw, PATH_Y, 4.5), M.path); path.receiveShadow = true; scene.add(path);
  const coping = new THREE.Mesh(ribbon(side, HALF_W - 0.12, HALF_W + 0.35, PATH_Y + 0.06, 1.6), M.stoneFrame); coping.receiveShadow = true; scene.add(coping);
  const copingFace = new THREE.Mesh(wallRibbon(side, HALF_W - 0.12, PATH_Y - 0.12, PATH_Y + 0.06, 1.0), M.stoneFrame); scene.add(copingFace);
  const bank = new THREE.Mesh(wallRibbon(side, HALF_W, -1.2, PATH_Y - 0.1, 2.6), M.bank); bank.receiveShadow = true; scene.add(bank);
  const ground = new THREE.Mesh(ribbon(side, HALF_W + pw, HALF_W + pw + 70, PATH_Y - 0.02, 5), M.ground); ground.receiveShadow = true; scene.add(ground);
}

// ---------------- water ----------------
const MAX_RIPPLES = 16;
const waterShader = {
  name: "InkWater",
  uniforms: {
    color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null },
    uTime: { value: 0 }, uRipples: { value: Array.from({ length: MAX_RIPPLES }, () => new THREE.Vector4(0, 0, -100, 0)) },
    uFogColor: { value: FOG.clone() }, uFogDensity: { value: 0.0085 }, uDeep: { value: new THREE.Color("#7f8a86") }

    const p = bankPoint(s, side, onTop ? HALF_W + rr(0.25, 0.6) : HALF_W + PATH_W[side] - rr(0, 0.4), PATH_Y + 0.04);
    tmpE.set(0, rand() * 3, 0); tmpQ.setFromEuler(tmpE); const sc = rr(0.6, 1.3);
    tmpM.compose(p, tmpQ, tmpS.set(sc, sc, sc)); inst.setMatrixAt(i, tmpM);
  }
  scene.add(inst);
}

// ---------------- falling petals + ripples ----------------
const PETALS = MOBILE ? 60 : 110;
const petalMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.075, 0.06), new THREE.MeshStandardMaterial({ color: "#f6e4e4", side: THREE.DoubleSide, roughness: 0.9 }), PETALS);
petalMesh.frustumCulled = false; scene.add(petalMesh);
const petals = Array.from({ length: PETALS }, () => ({ dur: rr(9, 15), off: rand() * 15, sx: rr(-1.6, 1.6), sz: rr(-1.6, 1.6), sy: rr(2.4, 4.4), drift: rr(0.4, 1.2), spin: rr(1, 3), cycle: -1 }));
const rCenter = river.getPointAt(0);
function riverDistance(x, z) {   // distance from the river centre line (coarse search near the blossom tree)
  let best = 1e9;
  for (let i = 30; i < 140; i++) { const p = RP[i]; const d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < best) best = d; }
  return Math.sqrt(best);
}
function updatePetals(t) {
  for (let i = 0; i < PETALS; i++) {
    const P = petals[i], lt = (t + P.off) % P.dur, cycle = Math.floor((t + P.off) / P.dur);
    const fall = 0.45, x0 = blossomBase.x + P.sx, z0 = blossomBase.z + P.sz, y0 = blossomBase.y + P.sy;
    // wind pushes petals toward the river (-x of the right bank is the water side)
    let x = x0 - P.drift * lt * 0.3 + Math.sin(lt * 1.3 + i) * 0.35, z = z0 + Math.cos(lt * 0.9 + i) * 0.3 - lt * 0.08;
    let y = y0 - lt * fall;
    const overWater = riverDistance(x, z) < HALF_W - 0.1;
    const floor = overWater ? 0.02 : PATH_Y + 0.07;
    let scale = 1, rx = lt * P.spin, rz = lt * P.spin * 0.7;
    if (y <= floor) {
      const landT = (y0 - floor) / fall;
      const since = lt - landT;
      const lx = x0 - P.drift * landT * 0.3 + Math.sin(landT * 1.3 + i) * 0.35, lz = z0 + Math.cos(landT * 0.9 + i) * 0.3 - landT * 0.08;
      x = lx + (overWater ? since * 0.05 : 0); z = lz + (overWater ? since * 0.12 : 0); y = floor;
      rx = -Math.PI / 2; rz = landT * P.spin;
      scale = Math.max(0, 1 - since / 1.6);
      if (overWater && P.cycle !== cycle) { P.cycle = cycle; addRipple(lx, lz, t - since); }
    }
    tmpE.set(rx, 0, rz); tmpQ.setFromEuler(tmpE);
    tmpM.compose(tmpP.set(x, y, z), tmpQ, tmpS.setScalar(scale)); petalMesh.setMatrixAt(i, tmpM);
  }
  petalMesh.instanceMatrix.needsUpdate = true;
}

// ---------------- distant ink mountains, sky, mist ----------------
scene.background = skyTexture();
const mountainLayers = [
  { tex: mountainTexture("132,142,152", [[0.1, 0.3, 0.22], [0.27, 0.52, 0.3], [0.4, 0.4, 0.2], [0.58, 0.34, 0.26], [0.8, 0.46, 0.3]], 0.22, 1), w: 700, h: 190, pos: [-25, 20, -235], op: 0.9 },
  { tex: mountainTexture("160,168,176", [[0.06, 0.36, 0.3], [0.3, 0.44, 0.3], [0.5, 0.6, 0.34], [0.72, 0.42, 0.3], [0.95, 0.38, 0.25]], 0.2, 0.6), w: 860, h: 240, pos: [10, 30, -320], op: 0.75 },
  { tex: mountainTexture("186,192,198", [[0.15, 0.45, 0.35], [0.45, 0.55, 0.3], [0.72, 0.5, 0.36], [0.95, 0.4, 0.3]], 0.18, 0.3), w: 1000, h: 300, pos: [0, 40, -420], op: 0.6 }
];
mountainLayers.slice().reverse().forEach(L => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(L.w, L.h), new THREE.MeshBasicMaterial({ map: L.tex, transparent: true, opacity: L.op, depthWrite: false, fog: false }));
  m.position.set(...L.pos); m.renderOrder = -1; scene.add(m);
});
const mists = [];
for (let i = 0; i < 9; i++) {
  const s = 30 + i * 18, f = frameAt(Math.min(s, RIVER_LEN - 1));
  const m = new THREE.Mesh(new THREE.PlaneGeometry(rr(70, 120), rr(5, 9)), new THREE.MeshBasicMaterial({ map: TEX.mist.clone(), color: "#f1ece2", transparent: true, opacity: rr(0.05, 0.11), depthWrite: false }));
  m.material.map.needsUpdate = true;
  m.position.set(f.p.x + rr(-8, 8), rr(1.5, 5.5), f.p.z);
  m.userData.speed = rr(0.004, 0.01) * (rand() < 0.5 ? 1 : -1);
  scene.add(m); mists.push(m);
}

// ---------------- lighting ----------------
scene.add(new THREE.HemisphereLight("#f3f1ea", "#8d8878", 1.15));
const sun = new THREE.DirectionalLight("#fff1da", 2.3);
sun.position.set(-38, 46, 16); sun.target.position.set(-2, 0, -22);
sun.castShadow = true;
sun.shadow.mapSize.set(MOBILE ? 1024 : 2048, MOBILE ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -50, right: 50, top: 50, bottom: -50, near: 1, far: 160 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03; sun.shadow.radius = 4;
scene.add(sun, sun.target);

// ---------------- post: ink outline + paper grain + vignette ----------------
// scene -> depth-enabled target, then one full-screen ink pass straight to the canvas
const sceneRT = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType, depthTexture: new THREE.DepthTexture(2, 2) });
const ink = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: null }, tDepth: { value: null }, tPaper: { value: TEX.paper },
    uRes: { value: new THREE.Vector2(innerWidth, innerHeight) }, uNear: { value: camera.near }, uFar: { value: camera.far }, uPx: { value: 1 }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse, tDepth, tPaper; uniform vec2 uRes; uniform float uNear, uFar, uPx;
    varying vec2 vUv;
    float invZ(vec2 uv) { float d = texture2D(tDepth, uv).x; float z = (uNear * uFar) / ((uFar - uNear) * d - uFar); return -1.0 / z; }
    float lum(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
    void main() {
      vec2 px = uPx / uRes;
      vec3 col = texture2D(tDiffuse, vUv).rgb;
      // creases and silhouettes: laplacian of 1/z (planes have none)
      float c0 = invZ(vUv);
      float lap = abs(invZ(vUv + vec2(px.x, 0.)) + invZ(vUv - vec2(px.x, 0.)) + invZ(vUv + vec2(0., px.y)) + invZ(vUv - vec2(0., px.y)) - 4.0 * c0);
      float dEdge = smoothstep(0.006, 0.035, lap / max(c0, 1e-5));
      // tonal edges, kept weak so stone textures do not turn into scribbles
      float l1 = lum(texture2D(tDiffuse, vUv + vec2(px.x, px.y)).rgb), l2 = lum(texture2D(tDiffuse, vUv - vec2(px.x, px.y)).rgb);
      float l3 = lum(texture2D(tDiffuse, vUv + vec2(px.x, -px.y)).rgb), l4 = lum(texture2D(tDiffuse, vUv - vec2(px.x, -px.y)).rgb);
      float lEdge = smoothstep(0.06, 0.22, length(vec2(l1 - l2, l3 - l4)));
      float farFade = 1.0 - smoothstep(0.012, 0.0035, c0);  // fade lines into the mist
      float edge = clamp(dEdge * 0.85 + lEdge * 0.3, 0.0, 1.0) * (1.0 - farFade * 0.0) * smoothstep(0.0015, 0.02, c0);
      col = mix(col, vec3(0.13, 0.12, 0.11) * (0.6 + 0.4 * lum(col)), edge * 0.78);
      // muted, warm rice-paper palette
      float L = lum(col);
      col = mix(vec3(L), col, 0.9) * vec3(1.03, 1.0, 0.95);
      float n = texture2D(tPaper, vUv * uRes / 512.0).r;
      col *= 0.95 + 0.1 * (n - 0.5) * 2.0 * 0.6;
      float v = smoothstep(0.92, 0.32, length((vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0) * 0.8));
      col *= mix(0.84, 1.0, v);
      #ifdef RAW
      col = texture2D(tDiffuse, vUv).rgb;
      #endif
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
ink.toneMapped = true;
if (params.has("raw")) ink.defines = { RAW: 1 };
const inkQuad = new FullScreenQuad(ink);

// ---------------- rice-paper frame (2D overlay) ----------------
const frameCanvas = document.getElementById("frame"), fg = frameCanvas.getContext("2d");
function drawFrame() {
  const dpr = Math.min(devicePixelRatio, 2), W = innerWidth, H = innerHeight;
  frameCanvas.width = W * dpr; frameCanvas.height = H * dpr; fg.setTransform(dpr, 0, 0, dpr, 0, 0);
  let fs = 777;
  const r = () => ((fs = (fs * 16807) % 2147483647) - 1) / 2147483646;
  const top = H * 0.12, bot = H * 0.1, side = Math.max(10, W * 0.016);
  // paper
  fg.fillStyle = "#e5dbc4"; fg.fillRect(0, 0, W, H);
  for (let i = 0; i < 260; i++) { const x = r() * W, y = r() * H, rad = 20 + r() * 120; const g = fg.createRadialGradient(x, y, 0, x, y, rad); g.addColorStop(0, `rgba(${r() < 0.5 ? "205,190,160" : "245,238,222"},${0.08 + r() * 0.12})`); g.addColorStop(1, "rgba(0,0,0,0)"); fg.fillStyle = g; fg.fillRect(x - rad, y - rad, rad * 2, rad * 2); }
  for (let i = 0; i < 4000; i++) { fg.fillStyle = `rgba(90,75,55,${r() * 0.08})`; fg.fillRect(r() * W, r() * H, 1, 1); }
  // ink motifs: hills and pines, top-right and bottom-left
  function inkHills(x0, y0, w, h, alpha, flip) {
    fg.save(); fg.translate(x0, y0); if (flip) fg.scale(-1, 1);
    for (let layer = 0; layer < 3; layer++) {
      fg.beginPath(); fg.moveTo(0, h);
      let ph = r() * 10;
      for (let x = 0; x <= w; x += 4) {
        const u = x / w, y = h * (0.85 - layer * 0.18) - Math.sin(u * 3.1 + ph) * h * 0.18 - Math.sin(u * 9 + ph * 2) * h * 0.06 - Math.exp(-((u - 0.3 - layer * 0.2) ** 2) * 40) * h * 0.45;
        fg.lineTo(x, y);
      }
      fg.lineTo(w, h); fg.closePath();
      const g = fg.createLinearGradient(0, 0, 0, h); g.addColorStop(0, `rgba(70,72,72,${alpha * (1 - layer * 0.28)})`); g.addColorStop(1, "rgba(70,72,72,0)");
      fg.fillStyle = g; fg.fill();
    }
    for (let k = 0; k < 4; k++) {   // pine silhouettes
      const px = w * (0.15 + r() * 0.7), py = h * (0.35 + r() * 0.3), s = h * (0.25 + r() * 0.2);
      fg.strokeStyle = `rgba(55,55,52,${alpha * 1.2})`; fg.lineWidth = 1.5; fg.beginPath(); fg.moveTo(px, py + s); fg.lineTo(px + s * 0.05, py); fg.stroke();
      for (let j = 0; j < 5; j++) { fg.fillStyle = `rgba(55,58,55,${alpha})`; fg.beginPath(); fg.ellipse(px + (r() - 0.5) * s * 0.6, py + j * s * 0.16, s * (0.35 - j * 0.04), s * 0.07, (r() - 0.5) * 0.4, 0, 7); fg.fill(); }
    }
    fg.restore();
  }
  inkHills(W * 0.68, 0, W * 0.32, top * 1.05, 0.38, false);
  inkHills(0, H - bot * 1.25, W * 0.28, bot * 1.25, 0.32, true);
  inkHills(-W * 0.02, -top * 0.15, W * 0.16, top * 0.9, 0.18, false);
  // cut the window with a dry-brush ragged edge
  fg.globalCompositeOperation = "destination-out";
  fg.fillStyle = "#000";
  fg.fillRect(side + 14, top + 14, W - 2 * side - 28, H - top - bot - 28);
  const brush = (x, y, rx, ry) => { fg.globalAlpha = 0.65 + r() * 0.35; fg.beginPath(); fg.ellipse(x, y, rx, ry, (r() - 0.5) * 0.1, 0, 7); fg.fill(); };
  for (let x = side; x < W - side; x += 3) { brush(x, top + 14 - r() * 18, 6 + r() * 10, 4 + r() * 12); brush(x, H - bot - 14 + r() * 18, 6 + r() * 10, 4 + r() * 12); }
  for (let y = top; y < H - bot; y += 3) { brush(side + 14 - r() * 12, y, 4 + r() * 8, 6 + r() * 8); brush(W - side - 14 + r() * 12, y, 4 + r() * 8, 6 + r() * 8); }
  fg.globalAlpha = 1; fg.globalCompositeOperation = "source-over";
  // faint wash where paper meets the picture
  fg.strokeStyle = "rgba(120,105,80,0.10)"; fg.lineWidth = 6; fg.strokeRect(side + 6, top + 6, W - 2 * side - 12, H - top - bot - 12);
}
drawFrame();

// ---------------- camera: 15 s glide upriver, then orbit ----------------
const INTRO = params.has("skip") ? 0 : 15;
const camPath = new THREE.CatmullRomCurve3([0.0, 6.5, 13, 19.5, 26].map((s, i) => { const f = frameAt(s); return f.p.clone().addScaledVector(f.n, -0.6).setY(5.2 - i * 0.62); }));
const lookPath = new THREE.CatmullRomCurve3([22, 30, 38, 46, 54].map((s, i) => { const f = frameAt(s); return f.p.clone().setY(3.4 - i * 0.18); }));
const controls = new OrbitControls(camera, canvas);
controls.enabled = false; controls.enableDamping = true; controls.dampingFactor = 0.06; controls.enablePan = false;
controls.minDistance = 8; controls.maxDistance = 34; controls.minPolarAngle = 1.12; controls.maxPolarAngle = 1.5; controls.rotateSpeed = 0.45; controls.zoomSpeed = 0.6;
let orbiting = false;
function startOrbit() {
  orbiting = true;
  camera.position.copy(camPath.getPointAt(1));
  controls.target.copy(lookPath.getPointAt(1));
  controls.update();
  const az = controls.getAzimuthalAngle();
  controls.minAzimuthAngle = az - 0.55; controls.maxAzimuthAngle = az + 0.55;
  controls.enabled = true;
  document.getElementById("hint").style.opacity = 0.8;
  setTimeout(() => document.getElementById("hint").style.opacity = 0, 5000);
}
canvas.addEventListener("dblclick", () => { if (!orbiting) startOrbit(); });
const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

// ---------------- resize ----------------
function onResize() {
  const pr = Math.min(devicePixelRatio, 2);
  renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight);
  sceneRT.setSize(innerWidth * pr, innerHeight * pr);
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 0.8 ? 64 : 48;   // portrait phones see more of the street
  camera.updateProjectionMatrix();
  ink.uniforms.uRes.value.set(innerWidth * pr, innerHeight * pr);
  ink.uniforms.uPx.value = pr > 1.5 ? 1.5 : 1;
  water.getRenderTarget().setSize(innerWidth * pr * reflScale, innerHeight * pr * reflScale);
  drawFrame();
}
addEventListener("resize", onResize);
onResize();

// ---------------- loop ----------------
const clock = new THREE.Clock();
const T0 = parseFloat(params.get("t") || "0");
function frame() {
  const t = params.has("freeze") ? parseFloat(params.get("freeze")) : clock.getElapsedTime() + T0;
  WIND.uTime.value = t;
  water.material.uniforms.uTime.value = t;
  if (!orbiting) {
    if (t >= INTRO) startOrbit();
    else { const u = ease(t / INTRO); camera.position.copy(camPath.getPointAt(u)); camera.lookAt(lookPath.getPointAt(u)); }
  }
  if (orbiting) controls.update();
  lanterns.forEach(l => { l.rotation.z = Math.sin(t * 1.1 + l.userData.phase) * 0.07; l.rotation.x = Math.sin(t * 0.8 + l.userData.phase * 1.3) * 0.04; });
  mists.forEach(m => { m.material.map.offset.x += m.userData.speed * 0.1; m.position.x += Math.sin(t * 0.05 + m.position.z) * 0.002; m.lookAt(camera.position.x, m.position.y, camera.position.z); });
  updatePetals(t);
  if (params.has("nopost")) renderer.render(scene, camera);
  else {
    renderer.setRenderTarget(sceneRT); renderer.render(scene, camera);
    ink.uniforms.tDiffuse.value = sceneRT.texture; ink.uniforms.tDepth.value = sceneRT.depthTexture;
    renderer.setRenderTarget(null); inkQuad.render(renderer);
  }
  requestAnimationFrame(frame);
}
frame();
window.__ready = true;
</script>
</body>
</html>
